<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 16px; color: #111;">
  <h2 style="font-size: 20px; margin-bottom: 8px;">Seu código de verificação</h2>
  <p style="color: #555; margin-bottom: 24px;">Use o código abaixo para confirmar seu e-mail. Ele expira em 10 minutos.</p>
  <div style="font-size: 36px; font-weight: bold; letter-spacing: 8px; text-align: center; padding: 24px; background: #f4f4f5; border-radius: 12px;">
    {{ .Token }}
  </div>
  <p style="color: #999; font-size: 12px; margin-top: 24px;">Se você não solicitou este código, ignore este e-mail.</p>
</body>
</html>
