# https://taskfile.dev

version: '3'

vars:
  GOOSE_VERSION: v3.27.0 # keep in sync with app/go.mod

tasks:
  # =============================
  # 🛠️ Development environment
  # =============================
  dev:
    desc: "Start the development environment"
    dir: app
    dotenv: ["../.env.test"]
    deps: [docs]
    cmds:
      - go run main.go
    silent: false

  lint:
    desc: "Run linters using golangci-lint with auto-fix"
    dir: app
    env:
      GOROOT: /home/kelvin/go
      GOPATH: /home/kelvin/workspace
    cmds:
      - golangci-lint run --fix --timeout 5m
    silent: false

  docs:
    desc: "Generate API documentation using swaggo"
    dir: app
    dotenv: ["../.env.test"]
    cmds:
      - swag init --output ./libs/docs --outputTypes json
      - echo "Docs -> http://localhost:${APP_PORT}/docs"
    silent: false

  # =============================
  # 🧪 Tests and utilities
  # =============================
  test:
    desc: "Start Postgres and pgAdmin"
    dotenv: ["../.env.test"]
    dir: infra
    deps: [db]
    cmds:
      - docker compose up

  test-local:
    desc: "Run tests directly (executado dentro do container Docker via task test)"
    dotenv: ["../.env.test"]
    dir: app
    cmds:
      - gotestsum --format testname -- ./... -p 1 -v
    silent: false

  db:
    desc: "Run tests inside Docker"
    dir: infra
    dotenv: ["../.env.test"]
    cmds:
      - docker compose -f docker-compose.db.yaml up -d --wait
    silent: false

  db-down:
    desc: "Stop Postgres and pgAdmin"
    dir: infra
    dotenv: ["../.env.test"]
    cmds:
      - docker compose down
    silent: true

  migrate:
    desc: "Run pending database migrations"
    dir: app
    dotenv: ["../.env.test"]
    deps: [db]
    cmds:
      - echo "goose {{.GOOSE_VERSION}}"
      - go run github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}} -dir libs/database/migrations postgres "host=${TEST_DATABASE_HOST} user=${TEST_DATABASE_USER} password=${TEST_DATABASE_PASSWORD} port=${TEST_DATABASE_PORT} dbname=${TEST_DATABASE_NAME}" up
    silent: false

  migrate-status:
    desc: "Show migration status"
    dir: app
    dotenv: ["../.env.test"]
    cmds:
      - echo "goose {{.GOOSE_VERSION}}"
      - go run github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}} -dir libs/database/migrations postgres "host=${TEST_DATABASE_HOST} user=${TEST_DATABASE_USER} password=${TEST_DATABASE_PASSWORD} port=${TEST_DATABASE_PORT} dbname=${TEST_DATABASE_NAME}" status
    silent: false

  migrate-down:
    desc: "Rollback the last migration"
    dir: app
    dotenv: ["../.env.test"]
    cmds:
      - echo "goose {{.GOOSE_VERSION}}"
      - go run github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}} -dir libs/database/migrations postgres "host=${TEST_DATABASE_HOST} user=${TEST_DATABASE_USER} password=${TEST_DATABASE_PASSWORD} port=${TEST_DATABASE_PORT} dbname=${TEST_DATABASE_NAME}" down
    silent: false

  mockgen:
    desc: "Generate mocks using mockery"
    dir: app
    cmds:
      - go run github.com/vektra/mockery/v2@v2.53.5 --all --output fixtures/mocks
    silent: false

  # =============================
  # ☁️ Terraform
  # =============================
  tf:init:
    desc: "Initialize Terraform"
    dir: infra/terraform
    cmds:
      - terraform init

  tf:plan:
    desc: "Preview infrastructure changes"
    dir: infra/terraform
    cmds:
      - terraform plan

  tf:apply:
    desc: "Apply infrastructure changes"
    dir: infra/terraform
    cmds:
      - terraform apply

  tf:destroy:
    desc: "Destroy all infrastructure"
    dir: infra/terraform
    cmds:
      - terraform destroy

  # =============================
  # 🔧 Infrastructure utils
  # =============================
  validate_alloy:
    desc: "Validate the Alloy configuration"
    dir: infra
    cmds:
      - docker run --rm -v $(pwd)/alloy.config.alloy:/etc/alloy/alloy.config.alloy grafana/alloy:latest validate /etc/alloy/alloy.config.alloy

  logs:
    desc: "Watch application logs"
    dir: infra
    cmds:
      - docker compose logs -f app
    interactive: true

  clean_docker:
    desc: "Prune all system and container resources"
    cmds:
      - docker system prune -a --volumes -f