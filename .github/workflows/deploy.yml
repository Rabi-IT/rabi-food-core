name: Deploy Production

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [test]
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: app

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          APP_VERSION: ${{ github.event.release.tag_name }}
        run: |
          docker build -t $ECR_REGISTRY/rabi-food-core:$APP_VERSION .
          docker tag $ECR_REGISTRY/rabi-food-core:$APP_VERSION $ECR_REGISTRY/rabi-food-core:latest
          docker push $ECR_REGISTRY/rabi-food-core:$APP_VERSION
          docker push $ECR_REGISTRY/rabi-food-core:latest

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run Migrations
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST_PRODUCTION }}
          DATABASE_USER: ${{ secrets.DATABASE_USER_PRODUCTION }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD_PRODUCTION }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT_PRODUCTION }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME_PRODUCTION }}
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@v3.27.0 \
            -dir libs/database/migrations postgres \
            "host=${DATABASE_HOST} user=${DATABASE_USER} password=${DATABASE_PASSWORD} port=${DATABASE_PORT} dbname=${DATABASE_NAME}" \
            up

      - name: Deploy
        uses: appleboy/ssh-action@master
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          APP_VERSION: ${{ github.event.release.tag_name }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER_PRODUCTION }}
          key: ${{ secrets.SSH_KEY_PRODUCTION }}
          envs: ECR_REGISTRY,APP_VERSION,AWS_REGION
          script: |
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
            sed -i "s|^APP_VERSION=.*|APP_VERSION=$APP_VERSION|" ~/rabi-food.env
            sed -i "s|^ECR_REGISTRY=.*|ECR_REGISTRY=$ECR_REGISTRY|" ~/rabi-food.env
            docker compose --env-file ~/rabi-food.env -f ~/docker-compose.yaml pull app
            docker compose --env-file ~/rabi-food.env -f ~/docker-compose.yaml up -d --no-deps app
