name: Deploy Production

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [test]
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: api

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          API_VERSION: ${{ github.event.release.tag_name }}
        run: |
          docker build -t $ECR_REGISTRY/rabi-food-core:$API_VERSION .
          docker tag $ECR_REGISTRY/rabi-food-core:$API_VERSION $ECR_REGISTRY/rabi-food-core:latest
          docker push $ECR_REGISTRY/rabi-food-core:$API_VERSION
          docker push $ECR_REGISTRY/rabi-food-core:latest

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run Migrations
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST_PRODUCTION }}
          DATABASE_USER: ${{ secrets.DATABASE_USER_PRODUCTION }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD_PRODUCTION }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT_PRODUCTION }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME_PRODUCTION }}
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@v3.27.0 \
            -dir libs/database/migrations postgres \
            "host=${DATABASE_HOST} user=${DATABASE_USER} password=${DATABASE_PASSWORD} port=${DATABASE_PORT} dbname=${DATABASE_NAME}" \
            up

      - name: Update ECS task definition
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          API_VERSION: ${{ github.event.release.tag_name }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition rabi-food-api --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
            --arg IMAGE "$ECR_REGISTRY/rabi-food-core:$API_VERSION" \
            --arg VERSION "$API_VERSION" \
            '.containerDefinitions[0].image = $IMAGE |
             .containerDefinitions[0].environment += [{"name":"API_VERSION","value":$VERSION}] |
             del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.placementConstraints,.compatibilities,.registeredAt,.registeredBy)')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster rabi-food --service rabi-food-api --task-definition $NEW_ARN
